name: CI

on:
  pull_request:
  push:
    branches: [main]

# Moindre privilège : lecture seule pour tous les jobs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit des dépendances (vulnérabilités hautes et critiques)
        run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests unitaires du domaine
        run: npm test

  construire:
    name: Construire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chemin de publication conforme au nom du dépôt (sensible à la casse)
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          grep -q "src=\"/${repo}/assets/" dist/index.html || { echo "base Vite ≠ /${repo}/ : page blanche sur Pages"; exit 1; }
      - name: Budget de poids (frugalité)
        run: |
          size=$(du -sk dist | cut -f1)
          echo "Taille du build : ${size} ko"
          test "$size" -lt 2048

  recette:
    name: Recette navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report
          retention-days: 7
